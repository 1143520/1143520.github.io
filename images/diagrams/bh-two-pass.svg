<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" style="display:block;width:100%;height:auto"><rect width="1080" height="400" fill="#FAFAF8"/><rect x="64.0" y="40.0" width="56.0" height="56.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="142.0" y="78.0" font-size="26" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">为什么画两遍</text><text x="142.0" y="106.0" font-size="11" font-weight="700" fill="#6E6E6E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start" letter-spacing="2.2">TWO-PASS BUILD</text><rect x="64.0" y="170.0" width="380.0" height="130.0" rx="0" fill="none" stroke="#111111" stroke-width="2"/><rect x="64.0" y="170.0" width="380.0" height="32.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="78.0" y="192.0" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start" letter-spacing="1.5">第 1 遍</text><text x="78.0" y="232.0" font-size="20" font-weight="700" fill="#D62828" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">H = 9000</text><text x="78.0" y="262.0" font-size="14" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">给足高度跑完</text><text x="78.0" y="284.0" font-size="14" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">量出内容到哪一行</text><line x1="460.0" y1="235.0" x2="530.0" y2="235.0" stroke="#6E6E6E" stroke-width="3" stroke-linecap="square"/><path d="M522 229.0 L530 235.0 L522 241.0" fill="none" stroke="#6E6E6E" stroke-width="3"/><rect x="560.0" y="170.0" width="380.0" height="130.0" rx="0" fill="none" stroke="#D62828" stroke-width="2.5"/><rect x="560.0" y="170.0" width="380.0" height="32.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="574.0" y="192.0" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start" letter-spacing="1.5">第 2 遍</text><text x="574.0" y="232.0" font-size="20" font-weight="700" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">H = 实际</text><text x="574.0" y="262.0" font-size="14" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">用精确高度重画</text><text x="574.0" y="284.0" font-size="14" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">脊线长度才对</text><rect x="64.0" y="330.0" width="4.0" height="20.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="82.0" y="347.0" font-size="14" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">第二遍不能省：脊线、背景矩形都按真实高度画，否则线画到一半就没了</text></svg>