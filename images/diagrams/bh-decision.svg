<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" style="display:block;width:100%;height:auto"><rect width="1080" height="480" fill="#FAFAF8"/><rect x="64.0" y="40.0" width="56.0" height="56.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="142.0" y="78.0" font-size="26" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">什么时候用它</text><text x="142.0" y="106.0" font-size="11" font-weight="700" fill="#6E6E6E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start" letter-spacing="2.2">WHEN TO USE / WHEN NOT</text><rect x="64.0" y="156.0" width="456.0" height="40.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="80.0" y="183.0" font-size="15" font-weight="700" fill="#FFFFFF" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start" letter-spacing="2">适合</text><rect x="64.0" y="204.0" width="10.0" height="10.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="88.0" y="214.0" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">复杂几何</text><text x="88.0" y="236.0" font-size="13" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">贝塞尔、圆弧、箭头</text><rect x="64.0" y="262.0" width="10.0" height="10.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="88.0" y="272.0" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">复用组件</text><text x="88.0" y="294.0" font-size="13" font-weight="400" fill="#6E6E6E" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">页头页脚、图标</text><rect x="64.0" y="320.0" width="1