<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" style="display:block;width:100%;height:auto"><rect width="1080" height="520" fill="#FAFAF8"/><rect x="64.0" y="40.0" width="56.0" height="56.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="142.0" y="78.0" font-size="26" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">两种写法</text><text x="142.0" y="106.0" font-size="11" font-weight="700" fill="#6E6E6E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start" letter-spacing="2.2">THE SAME LINE, TWO WAYS</text><rect x="64.0" y="150.0" width="456.0" height="300.0" rx="0" fill="none" stroke="#111111" stroke-width="2"/><rect x="64.0" y="150.0" width="456.0" height="34.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="78.0" y="173.0" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">A  手拼字符串</text><text x="78.0" y="212.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">def line(self, x1, y1, x2, y2):</text><text x="78.0" y="242.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    L = math.hypot(x2-x1, y2-y1)</text><text x="78.0" y="272.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    self.p.append(</text><text x="78.0" y="302.0" font-size="12.5" font-weight="400" fill="#6E6E6E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">      f'&lt;path class="gw"</text><text x="78.0" y="332.0" font-size="12.5" font-weight="400" fill="#D62828" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">        style="--len:{L:.1f}"</text><text x="78.0" y="362.0" font-size="12.5" font-weight="400" fill="#D62828" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">        d="M{x1} {y1} L{x2} {y2}"</text><text x="78.0" y="392.0" font-size="12.5" font-weight="400" fill="#6E6E6E" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">        stroke-dasharray=.../&gt;')</text><line x1="544.0" y1="300.0" x2="606.0" y2="300.0" stroke="#6E6E6E" stroke-width="3" stroke-linecap="square"/><path d="M598 294 L606 300 L598 306" fill="none" stroke="#6E6E6E" stroke-width="3"/><rect x="632.0" y="150.0" width="384.0" height="300.0" rx="0" fill="none" stroke="#D62828" stroke-width="2.5"/><rect x="632.0" y="150.0" width="384.0" height="34.0" rx="0" fill="#D62828" stroke="none" stroke-width="0"/><text x="646.0" y="173.0" font-size="13" font-weight="700" fill="#FFFFFF" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">B  DrawSVG</text><text x="646.0" y="212.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">import drawsvg as dw</text><text x="646.0" y="242.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start"></text><text x="646.0" y="272.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">d.append(dw.Line(</text><text x="646.0" y="302.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    x1, y1, x2, y2,</text><text x="646.0" y="332.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    stroke=col,</text><text x="646.0" y="362.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    stroke_width=w,</text><text x="646.0" y="392.0" font-size="12.5" font-weight="400" fill="#111111" font-family="Menlo,Consolas,DejaVu Sans Mono,monospace" text-anchor="start">    class_='gw'))</text><rect x="64.0" y="470.0" width="952.0" height="3.0" rx="0" fill="#111111" stroke="none" stroke-width="0"/><text x="64.0" y="500.0" font-size="15" font-weight="700" fill="#111111" font-family="Helvetica Neue,Helvetica,Arial,PingFang SC,Noto Sans CJK SC,sans-serif" text-anchor="start">省掉的是字符串拼接，不是动画机制</text></svg>